name: WW Core CI

on:
  push:
    branches: [main, master, "reboot/**"]
  pull_request:
    branches: [main, master]

jobs:
  core:
    name: Core terminal checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile the core entry points
        run: python -m py_compile gemini_bridge.py src/ww_client.py src/__init__.py
      - name: Verify the transport contract
        run: |
          python - <<'PY'
          import asyncio
          from types import SimpleNamespace
          from src.ww_client import WWClient

          class FakeChat:
              def __init__(self):
                  self.messages = []
              async def send_message(self, prompt):
                  self.messages.append(prompt)
                  return SimpleNamespace(text="reply: " + prompt)

          class FakeGemini:
              def __init__(self, *_):
                  self.chats = []
                  self.init_count = 0
              async def init(self, **_):
                  self.init_count += 1
              def start_chat(self):
                  chat = FakeChat()
                  self.chats.append(chat)
                  return chat

          async def check():
              instances = []
              def factory(*args):
                  client = FakeGemini(*args)
                  instances.append(client)
                  return client
              ww = WWClient("test-cookie", "test-cookie-ts", client_factory=factory)
              assert await ww.ask("first") == "reply: first"
              assert await ww.ask("second") == "reply: second"
              assert instances[0].init_count == 1
              assert instances[0].chats[0].messages == ["first", "second"]
              previous_chat = ww._chat
              await ww.new_conversation()
              assert ww._chat is not previous_chat
              assert len(instances[0].chats) == 2
              try:
                  await ww.ask(" ")
              except ValueError:
                  pass
              else:
                  raise AssertionError("empty prompt should be rejected")
              await ww.close()
              assert ww._client is None
          asyncio.run(check())
          PY
