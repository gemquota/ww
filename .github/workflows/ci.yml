name: WW Bridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality Gate

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff

    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Check formatting with ruff
      run: ruff format --check .

    - name: Syntax check all source
      run: |
        python -m py_compile gemini_bridge.py
        for f in src/*.py src/core/*.py src/tools/*.py src/utils/*.py src/plugins/*.py src/dashboard/*.py; do
          [ -f "$f" ] && python -m py_compile "$f" || true
        done

    - name: Architecture dependency validation
      run: python -m pytest .tel/tests/test_architecture_fitness.py -v --tb=short

    - name: Run all tests
      run: python -m pytest .tel/tests/ -v --tb=short

    - name: Quality gate
      run: python .tel/scripts/quality_gate.py

    - name: Run golden benchmark suite (if API keys set)
      if: env.SECURE_1PSID != '' && env.SECURE_1PSIDTS != ''
      run: python -m pytest .tel/tests/benchmarks/ -v --tb=short || true
      env:
        SECURE_1PSID: ${{ secrets.SECURE_1PSID }}
        SECURE_1PSIDTS: ${{ secrets.SECURE_1PSIDTS }}
