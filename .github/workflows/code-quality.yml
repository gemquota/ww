name: WW Core Code Quality

on:
  push:
    paths:
      - 'gemini_bridge.py'
      - 'src/ww_client.py'
      - 'src/cookie_loader.py'
      - 'src/markdown_renderer.py'
      - 'src/ww_settings.py'
      - 'src/artifacts.py'
      - 'src/project_context.py'
      - 'src/canvas_browser.py'
      - 'src/terminal.py'
      - 'tests/test_terminal.py'
      - 'tests/test_markdown_renderer.py'
      - 'tests/test_ww_settings.py'
      - 'tests/test_artifacts.py'
      - 'tests/test_project_context.py'
      - 'tests/test_ww_client_attachments.py'
      - 'tests/test_canvas_browser.py'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'gemini_bridge.py'
      - 'src/ww_client.py'
      - 'src/cookie_loader.py'
      - 'src/markdown_renderer.py'
      - 'src/ww_settings.py'
      - 'src/artifacts.py'
      - 'src/project_context.py'
      - 'tests/test_project_context.py'
      - 'tests/test_ww_client_attachments.py'
      - 'src/canvas_browser.py'
      - 'tests/test_markdown_renderer.py'
      - 'tests/test_ww_settings.py'
      - 'tests/test_artifacts.py'
      - 'tests/test_canvas_browser.py'
      - '.github/workflows/code-quality.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint core files
        run: ruff check --select E4,E7,E9,F gemini_bridge.py src/ww_client.py src/cookie_loader.py src/markdown_renderer.py src/ww_settings.py src/artifacts.py src/project_context.py src/canvas_browser.py src/terminal.py tests/test_terminal.py tests/test_markdown_renderer.py tests/test_ww_settings.py tests/test_artifacts.py tests/test_project_context.py tests/test_ww_client_attachments.py tests/test_canvas_browser.py
      - name: Compile core files
        run: python -m py_compile gemini_bridge.py src/*.py tests/test_markdown_renderer.py tests/test_ww_settings.py tests/test_artifacts.py tests/test_project_context.py tests/test_ww_client_attachments.py tests/test_canvas_browser.py
      - name: Test Markdown and elicitation rendering
        run: python -m unittest discover -s tests -v
