name: WW Core Code Quality

on:
  push:
    branches: [main, master, "integration/**"]
  pull_request:
    branches: [main, master]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint core and runtime files
        run: ruff check --select E4,E7,E9,F gemini_bridge.py src/ww_client.py src/cookie_loader.py src/markdown_renderer.py src/ww_settings.py src/artifacts.py src/project_context.py src/canvas_browser.py src/conversation_runtime.py src/prompting.py src/tools/registry.py src/tools/system_tools.py src/tools/args.py src/tools/__init__.py src/__init__.py src/ui_adapter.py src/dashboard/app.py src/dashboard/db.py tests/test_markdown_renderer.py tests/test_ww_settings.py tests/test_artifacts.py tests/test_project_context.py tests/test_ww_client_attachments.py tests/test_canvas_browser.py tests/test_conversation_runtime.py tests/test_cookie_loader.py tests/test_dashboard_runtime.py tests/test_dashboard_db.py tests/test_prompting.py tests/test_tool_environment.py tests/test_subprocess_cleanup.py tests/test_python_edit_validation.py tests/test_legacy_approval_adapter.py scripts/termux_acceptance.py scripts/check_frontend_js.py
      - name: Compile core files
        run: python -m compileall -q src tests gemini_bridge.py ww_dev.py
