name: WW Core Code Quality

on:
  push:
    paths:
      - 'gemini_bridge.py'
      - 'src/ww_client.py'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'gemini_bridge.py'
      - 'src/ww_client.py'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint core files
        run: ruff check --select E4,E7,E9,F gemini_bridge.py src/ww_client.py
      - name: Compile core files
        run: python -m py_compile gemini_bridge.py src/ww_client.py
