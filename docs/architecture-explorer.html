function baseStyles() {

function init() {
  cy = cytoscape({ container: document.getElementById('cy'), style: baseStyles() });
  cy.on('tap', 'node', function(e) {
    var d = e.target.data();
    if (d._view === 'pipeline' && d._modules) {
      var ln = document.getElementById('legend');
      ln.innerHTML = '<div class="tl" style="color:'+d.color+'">'+d.label.replace(/\\n/g,' ')+'</div><div class="row">Modules: '+d._modules.join(', ')+'</div>';
      return;
    }
    if (zoomed && d._back) { runView(curView); return; }
    if (!zoomed && d._grp) { expand(d._grp); return; }
    showMod(d);
  });
  cy.on('mouseover', 'node', function(e) {
    var n = e.target, c = {};
    n.connectedEdges().forEach(function(ce){ c[ce.source().id()]=1; c[ce.target().id()]=1; });
    cy.nodes().forEach(function(on){ if(on.id()==n.id()||c[on.id()]) on.addClass('highlight'); else on.addClass('faded'); });
    cy.edges().forEach(function(oe){ if(c[oe.source().id()]&&c[oe.target().id()]) oe.addClass('highlight'); else oe.addClass('faded'); });
  });
  cy.on('mouseout', 'node', function(){ cy.nodes().removeClass('faded highlight'); cy.edges().removeClass('faded highlight'); });
  runView('overview');
}

function runView(name) {
  curView = name; zoomed = null;
  document.querySelectorAll('#topbar .tab[data-view]').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-view')==name); });
  cy.elements().remove();
  document.getElementById('legend').innerHTML = '<div class="tl">loading...</div>';
  if (name == 'overview') viewOverview();
  else if (name == 'pipeline') viewPipeline();
  else if (name == 'state') viewStateMachine();
  else if (name == 'modules') viewModules();
  else if (name == 'hubs') viewWith('concentric');
  else if (name == 'tiers') viewWith('breadthfirst');
  else if (name == 'circle') viewWith('circle');
  update();
}

function viewOverview() {
  document.getElementById('mode-label').textContent = '43 modules in 10 groups';
  var gs = Object.keys(GROUP_COUNTS).sort();
  var mx = Math.max(1, ...gs.map(function(g){ return GROUP_COUNTS[g]; }));
  gs.forEach(function(g) {
    cy.add({ group: 'nodes', data: { id: 'g_'+g, label: (GROUP_NAMES[g]||g).substring(0,20)+' ('+GROUP_COUNTS[g]+')', color: GROUP_COLORS[g]||'#58a6ff', _grp: g, _cnt: GROUP_COUNTS[g] } });
  });
  cy.nodes().style({ width: function(n){ return 70+((n.data('_cnt')||1)/mx)*70; }, height: function(n){ return 40+((n.data('_cnt')||1)/mx)*40; }, fontSize: 10 });
  GROUP_EDGES.forEach(function(e){ cy.add({ group: 'edges', data: { source: 'g_'+e.source, target: 'g_'+e.target, count: e.count, ew: Math.min(e.count,8) }, style: { width: Math.min(e.count, 8), lineColor: '#58a6ff', targetArrowColor: '#58a6ff', opacity: 0.8, label: ''+e.count, fontSize: '8px', color: '#58a6ff', textBackgroundColor: '#0d1117', textBackgroundOpacity: 0.8, textBackgroundPadding: '2px' } }); });

  cy.nodes().positions(function(n){ var i = gs.indexOf(n.data('_grp')); return {x:(i%cols)*sx+sx/2, y:Math.floor(i/cols)*sy+sy/2}; });
  cy.fit(undefined, 60);
  setLegend('groups');
}

function expand(g) {
  zoomed = g;
  document.getElementById('mode-label').textContent = GROUP_NAMES[g]+' ('+GROUP_COUNTS[g]+' modules)';
  cy.add({ group: 'nodes', data: { id: '_b', label: '\u2190 Back', _back: 1, color: '#8b949e' } });
  var gm = MODS.filter(function(m){ return m.group == g; });
  var mx = Math.max(1, ...gm.map(function(m){ return m.lines; }));
  gm.forEach(function(m){ cy.add({ group: 'nodes', data: { id: m.id, label: m.file, color: GROUP_COLORS[g]||'#58a6ff', lines: m.lines, path: m.path, desc: m.desc, file: m.file } }); });
  cy.nodes().not('#_b').style({ width: function(n){ return 20+((n.data('lines')||1)/mx)*70; }, height: function(n){ return 16+((n.data('lines')||1)/mx)*25; }, fontSize: 7 });
  cy.getElementById('_b').style({ width: 90, height: 22, fontSize: 8, backgroundColor: 'transparent', borderWidth: 1, borderColor: '#30363d' });
  EDGES.forEach(function(e){ if(cy.getElementById(e.source).length&&cy.getElementById(e.target).length) cy.add({ group: 'edges', data: { source: e.source, target: e.target } }); });
  cy.layout({ name: 'cose', nodeRepulsion: 4000, gravity: 0.4, numIter: 600, fit: true, padding: 50, animate: true, animationDuration: 300 }).run();
}

function viewPipeline() {
  document.getElementById('mode-label').textContent = 'Data Pipeline: '+PIPELINE.length+' stages';
  PIPELINE.forEach(function(p) {
    cy.add({ group: 'nodes', data: { id: 'p_'+p.id, label: p.label+': '+p.modules.join(', '), color: p.color, _view: 'pipeline', _modules: p.modules } });
  });
  for (var i = 0; i < PIPELINE.length - 1; i++) {
    cy.add({ group: 'edges', data: { source: 'p_'+PIPELINE[i].id, target: 'p_'+PIPELINE[i+1].id }, style: { width: 3, lineColor: '#58a6ff', targetArrowColor: '#58a6ff', opacity: 0.9 } });
  }
  cy.nodes().style({ width: 130, height: 50, fontSize: 8, fontWeight: '700', textWrap: 'wrap', textValign: 'center', textHalign: 'center' });
  var sx = 145;
  cy.nodes().positions(function(n){ var p = PIPELINE.find(function(x){ return 'p_'+x.id == n.id(); }); return {x: p ? p.x*sx + sx : 0, y: 0}; });
  cy.fit(undefined, 80);
  setLegend('pipeline');
}

function viewStateMachine() {
  document.getElementById('mode-label').textContent = 'State Machine: '+STATES.length+' states, '+TRANSITIONS.length+' transitions';
  
  // Add state nodes
  STATES.forEach(function(s) {
    cy.add({
      group: 'nodes',
      data: { id: 's_'+s.id, label: s.label, color: s.color, _view: 'state' }
    });
  });
  
  // Style nodes
  cy.nodes().style({
    width: 120,
    height: 52,
    fontSize: 9,
    fontWeight: '700',
    textWrap: 'wrap',
    textValign: 'center',
    textHalign: 'center'
  });
  
  // Add transition edges (add first, style after)
  TRANSITIONS.forEach(function(t) {
    cy.add({
      group: 'edges',
      data: { source: 's_'+t.source, target: 's_'+t.target, label: t.label }
    });
  });
  
  // Style edges
  cy.edges().style({
    width: 1.5,
    lineColor: '#ffa657',
    targetArrowColor: '#ffa657',
    targetArrowShape: 'triangle-backcurve',
    arrowScale: 0.6,
    opacity: 0.9,
    label: 'data(label)',
    fontSize: '7px',
    color: '#ffa657',
    textBackgroundColor: '#0d1117',
    textBackgroundOpacity: 0.85,
    textBackgroundPadding: '2px',
    curveStyle: 'unbundled-bezier'
  });
  
  // Position states
  var sx = 150, sy = 120;
  cy.nodes().positions(function(n) {
    var sid = n.id().replace('s_', '');
    var s = STATES.find(function(x){ return x.id === sid; });
    if (!s) return {x: 0, y: 0};
    if (s.id === 'SHUTDOWN') return {x: sx * 7.5, y: 0};
    if (s.id === 'ERROR') return {x: sx * 3.5, y: sy};
    return {x: s.x * sx + sx/2, y: s.y * sy};
  });
  
  cy.fit(undefined, 100);
  setLegend('state');
}

function viewModules() {
  document.getElementById('mode-label').textContent = 'All '+MODS.length+' modules (size = lines of code)';
  var mx = Math.max(1, ...MODS.map(function(m){ return m.lines; }));
  MODS.forEach(function(m){ cy.add({ group: 'nodes', data: { id: m.id, label: m.file, color: GROUP_COLORS[m.group]||'#58a6ff', lines: m.lines, path: m.path, desc: m.desc, file: m.file } }); });
  cy.nodes().style({ width: function(n){ return 20+((n.data('lines')||1)/mx)*50; }, height: function(n){ return 14+((n.data('lines')||1)/mx)*20; }, fontSize: 6 });
  EDGES.forEach(function(e){ if(cy.getElementById(e.source).length&&cy.getElementById(e.target).length) cy.add({ group: 'edges', data: { source: e.source, target: e.target } }); });
  cy.layout({ name: 'cose', nodeRepulsion: 8000, gravity: 0.2, numIter: 800, fit: true, padding: 60, animate: true, animationDuration: 400 }).run();
  setLegend('groups');
}

function viewWith(layoutName) {
  document.getElementById('mode-label').textContent = layoutName.charAt(0).toUpperCase()+layoutName.slice(1);
  var mx = Math.max(1, ...MODS.map(function(m){ return m.lines; }));
  MODS.forEach(function(m){ cy.add({ group: 'nodes', data: { id: m.id, label: m.file, color: GROUP_COLORS[m.group]||'#58a6ff', lines: m.lines, path: m.path } }); });
  cy.nodes().style({ width: function(n){ return 20+((n.data('lines')||1)/mx)*50; }, height: function(n){ return 14+((n.data('lines')||1)/mx)*20; }, fontSize: 6 });
  EDGES.forEach(function(e){ if(cy.getElementById(e.source).length&&cy.getElementById(e.target).length) cy.add({ group: 'edges', data: { source: e.source, target: e.target } }); });
  var opts = { fit: true, padding: 60, animate: true, animationDuration: 400 };
  opts.name = layoutName;
  if (layoutName == 'concentric') { opts.concentric = function(n){ return n.connectedEdges().length; }; opts.levelWidth = function(){ return 2; }; opts.minNodeSpacing = 30; }
  if (layoutName == 'breadthfirst') { opts.directed = true; opts.spacingFactor = 1.3; }
  if (layoutName == 'circle') { opts.spacingFactor = 1.2; }
  cy.layout(opts).run();
  setLegend('groups');
}

function showMod(d) {
  var m = MOD_MAP[d.id];
  if (!m) return;
  var deps = []; EDGES.forEach(function(e){ if(e.source==m.id||e.target==m.id) deps.push(e.source==m.id?e.target:e.source); });
  var ln = document.getElementById('legend');
  ln.innerHTML = '<div class="tl" style="color:'+(d.color||'#58a6ff')+'">'+(m.file||d.label||'')+' ('+m.lines+' lines)</div>'+
    '<div class="row" style="color:#c9d1d9">'+(m.desc||m.path||'')+'</div>'+
    '<div class="row">src/'+m.path+' &middot; '+(GROUP_NAMES[m.group]||'')+'</div>'+
    (deps.length ? '<div class="row" style="margin-top:1px;border-top:1px solid #21262d;padding-top:1px">'+deps.map(function(di){ var dm=MOD_MAP[di]; return dm?dm.file:di; }).join(', ').substring(0,100)+'</div>' : '');
}

function setLegend(type) {
  if (type == 'groups') {
    var l = '<div class="tl">Groups</div>';
    Object.keys(GROUP_COUNTS).sort().forEach(function(g){ l += '<div class="row"><span class="dot" style="background:'+(GROUP_COLORS[g]||'#58a6ff')+'"></span>'+(GROUP_NAMES[g]||g)+' ('+GROUP_COUNTS[g]+')</div>'; });
    document.getElementById('legend').innerHTML = l;
  } else if (type == 'pipeline') {
    document.getElementById('legend').innerHTML = '<div class="tl">Data Pipeline</div><div class="row">Left to right = data flow direction</div><div class="row">Click a stage to see its modules</div>';
  } else if (type == 'state') {
    document.getElementById('legend').innerHTML = '<div class="tl">State Machine</div><div class="row">Orange edges = transition triggers</div><div class="row">Top row = happy path</div><div class="row">Red node = failure states</div>';
  }
}

function update(){ document.getElementById('status').textContent = cy.nodes().length+' nodes, '+cy.edges().length+' edges'; }

var tabs = document.querySelectorAll('#topbar .tab[data-view]');
for(var i=0;i<tabs.length;i++) (function(t){ t.onclick=function(){ runView(this.getAttribute('data-view')); }; })(tabs[i]);
init();
</script>
</body>
