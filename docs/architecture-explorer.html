: "orchestrator", "target": "core_context"}, {"source": "orchestrator", "target": "core_healing"}, {"source": "orchestrator", "target": "core_memory"}, {"source": "orchestrator", "target": "core_patterns_event_bus"}, {"source": "orchestrator", "target": "core_patterns_profile_manifest"}, {"source": "orchestrator", "target": "core_schemas"}, {"source": "orchestrator", "target": "core_theme"}, {"source": "orchestrator", "target": "core_utils_deprecation"}, {"source": "orchestrator", "target": "core_utils_error_translator"}, {"source": "orchestrator", "target": "core_utils_validation"}, {"source": "orchestrator", "target": "diff_engine"}, {"source": "orchestrator", "target": "executor"}, {"source": "orchestrator", "target": "file_watcher"}, {"source": "orchestrator", "target": "gfx_mascot_tui"}, {"source": "orchestrator", "target": "observability"}, {"source": "orchestrator", "target": "security"}, {"source": "orchestrator", "target": "tools_registry"}, {"source": "orchestrator", "target": "tools_system_tools"}, {"source": "orchestrator", "target": "ui"}, {"source": "security", "target": "ui"}, {"source": "tools_system_tools", "target": "core_context"}, {"source": "tools_system_tools", "target": "security"}, {"source": "tui", "target": "core_context"}, {"source": "tui", "target": "ui"}, {"source": "ww_client", "target": "core_utils_web_client"}];
var GROUP_EDGES = [{"source": "bridge", "target": "core", "count": 5}, {"source": "core", "target": "gfx", "count": 1}, {"source": "core", "target": "observability", "count": 3}, {"source": "core", "target": "root", "count": 11}, {"source": "core", "target": "security", "count": 3}, {"source": "core", "target": "tools", "count": 6}, {"source": "core", "target": "utils", "count": 6}, {"source": "observability", "target": "root", "count": 1}, {"source": "root", "target": "security", "count": 1}, {"source": "root", "target": "utils", "count": 2}, {"source": "security", "target": "tools", "count": 1}];
var GROUP_COUNTS = {"root": 11, "core": 13, "bridge": 7, "utils": 4, "demo": 1, "gfx": 1, "observability": 2, "plugins": 1, "security": 1, "tools": 2};
var GROUP_COLORS = {"root": "#58a6ff", "core": "#a371f7", "tools": "#3fb950", "utils": "#d29922", "bridge": "#f78166", "gfx": "#56d4dd", "plugins": "#ff7b72", "demo": "#7ee787", "observability": "#f0c000", "security": "#ff7b72"};
var GROUP_NAMES = {"root": "Root entry", "core": "Core subsystem", "tools": "Tool registry", "utils": "Utilities", "bridge": "Bridge patterns", "gfx": "Mascot GFX", "plugins": "Plugin system", "demo": "Demo mode", "observability": "Observability", "security": "Security"};

var MOD_MAP = {}; MODS.forEach(function(m){ MOD_MAP[m.id] = m; });
var cy, zoomed = null;
function init() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      { selector: 'node', style: { backgroundColor: '#1c2333', label: 'data(label)', color: '#c9d1d9', fontSize: '10px', fontFamily: 'system-ui,sans-serif', textWrap: 'wrap', textValign: 'center', textHalign: 'center', shape: 'round-rectangle', borderWidth: 2, borderColor: 'data(color)', backgroundOpacity: 0.9, padding: '6px', fontWeight: '600' } },
      { selector: 'edge', style: { width: 0.5, lineColor: '#58a6ff', targetArrowColor: '#58a6ff', targetArrowShape: 'triangle-backcurve', arrowScale: 0.3, curveStyle: 'bezier', opacity: 0.3 } },
      { selector: 'node.faded', style: { opacity: 0.15 } },
      { selector: 'node.highlight', style: { borderWidth: 3, borderColor: '#f0f6fc' } },
      { selector: 'edge.faded', style: { opacity: 0.02 } },
      { selector: 'edge.highlight', style: { opacity: 0.9, width: 3, lineColor: '#f0f6fc' } }
    ]
  });
  overview(); legend();
  cy.on('tap', 'node', function(e) {
    var d = e.target.data();
    if (zoomed && d._back) { overview(); return; }
    if (!zoomed && d._grp) { expand(d._grp); return; }
    showMod(d);
  });
  cy.on('mouseover', 'node', function(e) {
    var n = e.target, c = {};
    n.connectedEdges().forEach(function(ce){ c[ce.source().id()]=1; c[ce.target().id()]=1; });
    cy.nodes().forEach(function(on){ if(on.id()==n.id()||c[on.id()]) on.addClass('highlight'); else on.addClass('faded'); });
    cy.edges().forEach(function(oe){ if(c[oe.source().id()]&&c[oe.target().id()]) oe.addClass('highlight'); else oe.addClass('faded'); });
  });
  cy.on('mouseout', 'node', function(){ cy.nodes().removeClass('faded highlight'); cy.edges().removeClass('faded highlight'); });
}

function overview() {
  zoomed = null;
  cy.elements().remove();
  var gs = Object.keys(GROUP_COUNTS).sort();
  var mx = Math.max(1, ...gs.map(function(g){ return GROUP_COUNTS[g]; }));
  gs.forEach(function(g) {
    cy.add({ group: 'nodes', data: { id: 'g_'+g, label: (GROUP_NAMES[g]||g)+' ('+GROUP_COUNTS[g]+')', color: GROUP_COLORS[g]||'#58a6ff', _grp: g, _cnt: GROUP_COUNTS[g] } });
  });
  cy.nodes().style({ width: function(n){ return 80+((n.data('_cnt')||1)/mx)*80; }, height: function(n){ return 50+((n.data('_cnt')||1)/mx)*50; }, fontSize: function(n){ return (n.data('_cnt')||1)>6?11:9; } });
  GROUP_EDGES.forEach(function(e){ cy.add({ group: 'edges', data: { source: 'g_'+e.source, target: 'g_'+e.target, count: e.count } }); });
  var cols = 2, sx = 280, sy = 140;
  cy.nodes().positions(function(n){ var i = gs.indexOf(n.data('_grp')); return {x:(i%cols)*sx+sx/2, y:Math.floor(i/cols)*sy+sy/2}; });
  cy.fit(undefined, 80); update();
}

function expand(g) {
  zoomed = g;
  document.getElementById('mode-label').textContent = (GROUP_NAMES[g]||g)+' ('+GROUP_COUNTS[g]+' modules)';
  cy.elements().remove();
  cy.add({ group: 'nodes', data: { id: '_b', label: '← Back', _back: 1, color: '#8b949e' } });
  var gm = MODS.filter(function(m){ return m.group == g; });
  var mx = Math.max(1, ...gm.map(function(m){ return m.lines; }));
  gm.forEach(function(m) { cy.add({ group: 'nodes', data: { id: m.id, label: m.file, color: GROUP_COLORS[g]||'#58a6ff', _mod: 1, file: m.file, lines: m.lines } }); });
  cy.nodes().not('#_b').style({ width: function(n){ return 20+((n.data('lines')||1)/mx)*80; }, height: function(n){ return 16+((n.data('lines')||1)/mx)*30; } });
  cy.getElementById('_b').style({ width: 100, height: 24, fontSize: 9, backgroundColor: 'transparent', borderWidth: 1, borderColor: '#30363d' });
  EDGES.forEach(function(e){ if(cy.getElementById(e.source).length&&cy.getElementById(e.target).length) cy.add({ group: 'edges', data: { source: e.source, target: e.target } }); });
  cy.layout({ name: 'cose', nodeRepulsion: 5000, gravity: 0.5, numIter: 800, fit: true, padding: 60, animate: true, animationDuration: 300 }).run();
  update();
}

function showMod(d) {
  var m = MOD_MAP[d.id]; if(!m) return;
  var deps = []; EDGES.forEach(function(e){ if(e.source==d.id||e.target==d.id) deps.push(e.source==d.id?e.target:e.source); });
  document.getElementById('legend').innerHTML = '<div class="tl" style="color:'+d.color+'">'+m.file+' ('+m.lines+' lines)</div>'+
    '<div class="row" style="color:#c9d1d9">'+(m.desc||'No docstring')+'</div>'+
    '<div class="row">src/'+m.path+' · '+(GROUP_NAMES[m.group]||m.group)+'</div>'+
    (deps.length ? '<div class="row" style="margin-top:2px;border-top:1px solid #21262d;padding-top:2px">'+deps.map(function(di){ var dm=MOD_MAP[di]; return dm?dm.file:di; }).join(', ')+'</div>' : '');
}

function legend() {
  var l = '<div class="tl">Module Groups</div>';
  Object.keys(GROUP_COUNTS).sort().forEach(function(g){ l += '<div class="row"><span class="dot" style="background:'+(GROUP_COLORS[g]||'#58a6ff')+'"></span>'+(GROUP_NAMES[g]||g)+' ('+GROUP_COUNTS[g]+')</div>'; });
  document.getElementById('legend').innerHTML = l;
}

function update(){ document.getElementById('status').textContent = cy.nodes().length+' nodes, '+cy.edges().length+' edges'; }

function layout(name) {
  zoomed = null;
  document.querySelectorAll('#topbar .tab[data-layout]').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-layout')==name); });
  cy.elements().remove();
  if(name=='overview'){ overview(); return; }
  document.getElementById('mode-label').textContent = name.charAt(0).toUpperCase()+name.slice(1);
  var mx = Math.max(1, ...MODS.map(function(m){ return m.lines; }));
  MODS.forEach(function(m){ cy.add({ group:'nodes', data:{ id:m.id, label:m.file, color:GROUP_COLORS[m.group]||'#58a6ff', _mod:1, lines:m.lines } }); });
  cy.nodes().style({ width:function(n){ return 20+((n.data('lines')||1)/mx)*60; }, height:function(n){ return 16+((n.data('lines')||1)/mx)*25; } });
  EDGES.forEach(function(e){ if(cy.getElementById(e.source).length&&cy.getElementById(e.target).length) cy.add({ group:'edges', data:{ source:e.source, target:e.target } }); });
  if(name=='hubs') cy.layout({ name:'concentric', concentric:function(n){ return n.connectedEdges().length; }, levelWidth:function(){ return 2; }, minNodeSpacing:30, fit:true, padding:60, animate:true, animationDuration:400 }).run();
  else if(name=='tiers') cy.layout({ name:'breadthfirst', directed:true, spacingFactor:1.3, fit:true, padding:60, animate:true, animationDuration:400 }).run();
  else if(name=='circle') cy.layout({ name:'circle', spacingFactor:1.2, fit:true, padding:60, animate:true, animationDuration:400 }).run();
  else cy.layout({ name:'cose', nodeRepulsion:8000, gravity:0.3, numIter:1000, fit:true, padding:60, animate:true, animationDuration:400 }).run();
  update();
}
var tabs = document.querySelectorAll('#topbar .tab[data-layout]');
for(var i=0;i<tabs.length;i++) (function(t){ t.onclick=function(){ layout(this.getAttribute('data-layout')); }; })(tabs[i]);
init();
</script>
