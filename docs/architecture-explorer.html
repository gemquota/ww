var GROUP_EDGES = [{"source": "grp_bridge", "target": "grp_root", "count": 4}, {"source": "grp_core", "target": "grp_dashboard", "count": 1}, {"source": "grp_core", "target": "grp_root", "count": 6}, {"source": "grp_core", "target": "grp_utils", "count": 1}, {"source": "grp_dashboard", "target": "grp_root", "count": 1}, {"source": "grp_dashboard", "target": "grp_tools", "count": 1}, {"source": "grp_dashboard", "target": "grp_utils", "count": 1}, {"source": "grp_gfx", "target": "grp_root", "count": 1}, {"source": "grp_plugins", "target": "grp_root", "count": 1}, {"source": "grp_root", "target": "grp_tools", "count": 3}, {"source": "grp_root", "target": "grp_utils", "count": 7}];

var GROUP_COLORS = {"root": "#58a6ff", "core": "#a371f7", "tools": "#3fb950", "utils": "#d29922", "bridge": "#f78166", "dashboard": "#db6d28", "gfx": "#56d4dd", "plugins": "#ff7b72", "demo": "#7ee787"};
var GROUP_NAMES = {"root": "Root (src/)", "core": "Core Subsystem", "tools": "Tool Registry", "utils": "Utilities", "bridge": "Bridge Patterns", "dashboard": "Web Dashboard", "gfx": "Mascot GFX", "plugins": "Plugin System", "demo": "Demo Mode"};

var MOD_MAP = {}; MODS.forEach(function(m){ MOD_MAP[m.id] = m; });
var GROUP_MAP = {}; GROUPS.forEach(function(g){ GROUP_MAP[g.group] = g; });

var cy, currentLayout = 'group', zoomedGroup = null;

function init() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    layout: { name: 'grid' },
    style: [
      { selector: 'node', style: {
        'background-color': '#1c2333',
        'label': 'data(label)',
        'color': '#c9d1d9',
        'font-size': '10px',
        'font-family': 'system-ui, sans-serif',
        'text-wrap': 'wrap',
        'text-valign': 'center',
        'text-halign': 'center',
        'shape': 'round-rectangle',
        'border-width': 2,
        'border-color': 'data(color)',
        'background-opacity': 0.9,
        'padding': '6px',
        'font-weight': '600'
      }},
      { selector: 'node.mod', style: {
        'font-size': '7px',
        'font-family': 'monospace',
        'font-weight': '400',
        'border-width': 1.5,
        'text-valign': 'bottom',
        'text-halign': 'center',
        'text-margin-y': '8px',
        'shape': 'round-rectangle',
        'background-color': '#1c2333',
        'width': 70,
        'height': 30,
        'padding': '0'
      }},
      { selector: 'edge', style: {
        'width': 1,
        'line-color': '#58a6ff',
        'target-arrow-color': '#58a6ff',
        'target-arrow-shape': 'triangle-backcurve',
        'arrow-scale': 0.4,
        'curve-style': 'bezier',
        'opacity': 0.5,
        'line-style': 'solid'
      }},
      { selector: 'edge.group-edge', style: {
        'width': 'mapData(count, 1, 30, 2, 8)',
        'opacity': 0.6,
        'line-color': '#58a6ff',
        'target-arrow-color': '#58a6ff',
        'label': 'data(count)',
        'font-size': '8px',
        'color': '#58a6ff',
        'text-background-color': '#0d1117',
        'text-background-opacity': 0.9,
        'text-background-padding': '2px',
        'curve-style': 'unbundled-bezier'
      }},
      { selector: 'edge.faded-edge', style: { 'opacity': 0.05 } },
      { selector: 'node.faded', style: { 'opacity': 0.15 } },
      { selector: 'node.highlight', style: { 'border-width': 3, 'border-color': '#f0f6fc' } },
      { selector: 'edge.highlight-edge', style: { 'opacity': 0.9, 'width': 3, 'line-color': '#f0f6fc', 'target-arrow-color': '#f0f6fc' } }
    ]
  });
  
  // Show info banner
  document.getElementById('info').classList.add('show');
  setTimeout(function(){ document.getElementById('info').classList.remove('show'); }, 5000);
  
  // Render default overview
  renderOverview();
  
  // Click handler
  cy.on('tap', 'node', function(e) {
    if (currentLayout === 'group' && !zoomedGroup) {
      var d = e.target.data();
      if (d._type === 'group') {
        expandGroup(d.group_name);
      }
    } else if (currentLayout === 'group' && zoomedGroup) {
      // Click a module in expanded view
      var d = e.target.data();
      if (d._type === 'module') {
        showModuleDetail(d);
      } else if (d._isBack) {
        renderOverview();
      }
    } else {
      // Module view - show detail
      var d = e.target.data();
      if (d._type === 'module') showModuleDetail(d);
    }
  });
  
  // Hover highlight
  cy.on('mouseover', 'node', function(e) {
    var n = e.target;
    if (currentLayout === 'group' && !zoomedGroup) {
      // Group overview: highlight connected groups
      var connected = {};
      n.connectedEdges().forEach(function(ce){
        connected[ce.source().id()] = true;
        connected[ce.target().id()] = true;
      });
      cy.nodes().forEach(function(on){
        if(on.id() === n.id()) { on.addClass('highlight'); return; }
        if(connected[on.id()]) on.addClass('highlight');
        else on.addClass('faded');
      });
      cy.edges().forEach(function(oe){
        var src = oe.source().id(), tgt = oe.target().id();
        if(src === n.id() || tgt === n.id()) oe.addClass('highlight-edge');
        else oe.addClass('faded-edge');
      });
    } else {
      // Module view: highlight neighbors
      var nb = {};
      n.neighborhood().nodes().forEach(function(x){ nb[x.id()] = true; });
      cy.nodes().forEach(function(on){
        if(on.id() === n.id()) return;
        if(nb[on.id()]) on.addClass('highlight');
        else on.addClass('faded');
      });
      cy.edges().forEach(function(oe){
        if(nb[oe.source().id()] && nb[oe.target().id()]) oe.addClass('highlight-edge');
        else oe.addClass('faded-edge');
      });
    }
  });
  cy.on('mouseout', 'node', function(){
    cy.nodes().removeClass('faded highlight');
    cy.edges().removeClass('faded-edge highlight-edge');
  });
  
  // Build legend
  buildLegend();
}

function renderOverview() {
  zoomedGroup = null;
  currentLayout = 'group';
  document.getElementById('mode-label').textContent = 'Overview';
  cy.elements().remove();
  
  // Add group nodes
  GROUPS.forEach(function(g) {
    var label = g.name;
    cy.add({
      group: 'nodes',
      data: {
        id: g.id,
        label: label,
        color: g.color,
        _type: 'group',
        group_name: g.group,
        count: g.count,
        lines: g.total_lines
      },
      classes: 'group-node'
    });
  });
  
  // Style group nodes with size = module count
  var maxCount = 1;
  GROUPS.forEach(function(g){ if(g.count > maxCount) maxCount = g.count; });
  cy.nodes().style({
    'width': function(n){ var c = n.data('count') || 1; return 60 + (c/maxCount) * 100; },
    'height': function(n){ var c = n.data('count') || 1; return 40 + (c/maxCount) * 60; },
    'font-size': function(n){ var c = n.data('count') || 1; return c > 10 ? 11 : 9; }
  });
  
  // Add group edges
  GROUP_EDGES.forEach(function(e) {
    cy.add({
      group: 'edges',
      data: {
        source: e.source,
        target: e.target,
        count: e.count
      },
      classes: 'group-edge'
    });
  });
  
  // Layout: use grid positioning with groups in logical order
  var order = ['root','core','tools','utils','bridge','dashboard','gfx','plugins','demo'];
  var cols = 3;
  var spacingX = 200, spacingY = 130;
  cy.nodes().positions(function(n){
    var d = n.data(), idx = order.indexOf(d.group_name);
    if(idx < 0) idx = 0;
    var col = idx % cols, row = Math.floor(idx / cols);
    return { x: col * spacingX + spacingX/2, y: row * spacingY + spacingY/2 };
  });
  cy.fit(undefined, 80);
  
  updateStatus();
}

function expandGroup(groupName) {
  var g = GROUP_MAP[groupName];
  if (!g) return;
  zoomedGroup = groupName;
  cy.elements().remove();
  
  // Add back button
  cy.add({ group: 'nodes', data: { id: '_back', label: '← Back to Overview', _isBack: true, color: '#8b949e' } });
  
  // Add module nodes for this group
  var gMods = MODS.filter(function(m){ return m.group === groupName; });
  gMods.forEach(function(m) {
    cy.add({
      group: 'nodes',
      data: {
        id: m.id,
        label: m.file,
        color: g.color,
        _type: 'module',
        file: m.file,
        path: m.path,
        desc: m.desc,
        group: m.group,
        lines: m.lines
      },
      classes: 'mod'
    });
  });
  
  // Add edges between modules in this group
  EDGES.forEach(function(e) {
    var s = e.source, t = e.target;
    var sm = MOD_MAP[s], tm = MOD_MAP[t];
    if (sm && tm && sm.group === groupName && tm.group === groupName) {
      cy.add({ group: 'edges', data: { source: s, target: t } });
    }
  });
  
  // Also add edges TO modules outside this group (lighter)
  var outsideEdges = [];
  EDGES.forEach(function(e) {
    var s = e.source, t = e.target;
    var sm = MOD_MAP[s], tm = MOD_MAP[t];
    if (sm && tm) {
      if (sm.group === groupName && tm.group !== groupName) outsideEdges.push({s: s, t: t});
      if (tm.group === groupName && sm.group !== groupName) outsideEdges.push({s: s, t: t});
    }
  });
  outsideEdges.forEach(function(e) {
    // Only add if target node exists in graph
    if (cy.getElementById(e.s).length && cy.getElementById(e.t).length) {
      cy.add({ group: 'edges', data: { source: e.s, target: e.t } });
    }
  });
  
  // Layout
  var maxLines = 1;
  gMods.forEach(function(m){ if(m.lines > maxLines) maxLines = m.lines; });
  cy.nodes().forEach(function(n){
    if (n.data()._isBack) {
      n.style({ 'width': 120, 'height': 24, 'font-size': 9, 'background-color': 'transparent', 'border-width': 1, 'border-color': '#30363d', 'text-valign': 'center', 'text-halign': 'center' });
    } else {
      var lines = n.data('lines') || 1;
      n.style({ 'width': 20 + (lines/maxLines)*80, 'height': 18 + (lines/maxLines)*30 });
    }
  });
  
  document.getElementById('mode-label').textContent = g.name + ' (' + gMods.length + ' modules)';
  
  cy.layout({ name: 'cose', nodeRepulsion: 5000, gravity: 0.5, numIter: 800, fit: true, padding: 60, animate: true, animationDuration: 300 }).run();
  updateStatus();
}

function showModuleDetail(d) {
  var m = MOD_MAP[d.id];
  if (!m) return;
  // Highlight the module and show info in legend area
  var deps = [];
  EDGES.forEach(function(e){
    if(e.source === d.id) deps.push(e.target);
    if(e.target === d.id) deps.push(e.source);
  });
  var depNames = deps.map(function(depId){
    var dm = MOD_MAP[depId];
    return dm ? dm.file : depId;
  });
  var legend = document.getElementById('legend');
  legend.innerHTML = '<div class="tl" style="color:' + d.color + '">' + m.file + '</div>' +
    '<div class="row" style="color:#c9d1d9;margin-bottom:3px">' + (m.desc || 'No docstring') + '</div>' +
    '<div class="row">Path: src/' + m.path + '</div>' +
    '<div class="row">Lines: ' + m.lines + '</div>' +
    '<div class="row">Group: ' + (GROUP_NAMES[m.group] || m.group) + '</div>' +
    '<div class="row" style="margin-top:2px;border-top:1px solid #21262d;padding-top:2px">Connections: ' + depNames.join(', ') + '</div>';
  
  // Highlight node
  cy.nodes().removeClass('highlight faded');
  var n = cy.getElementById(d.id);
  if (n.length) n.addClass('highlight');
  cy.fit(n, 100);
}

function buildLegend() {
  var l = '<div class="tl">Groups</div>';
  var order = ['root','core','tools','utils','bridge','dashboard','gfx','plugins','demo'];
  order.forEach(function(g){
    var grp = GROUP_MAP[g];
    if (grp) l += '<div class="row"><span class="dot" style="background:' + grp.color + '"></span>' + grp.name + ' (' + grp.count + ')</div>';
  });
  document.getElementById('legend').innerHTML = l;
}

function updateStatus() {
  document.getElementById('status').textContent = cy.nodes().length + ' nodes | ' + cy.edges().length + ' edges';
}

// Layout switching
function runLayout(name) {
  currentLayout = name;
  zoomedGroup = null;
  document.querySelectorAll('#topbar .tab[data-layout]').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-layout') === name);
  });
  
  cy.elements().remove();
  
  if (name === 'group') {
    renderOverview();
    return;
  }
  
  document.getElementById('mode-label').textContent = name.charAt(0).toUpperCase() + name.slice(1);
  
  // Add all module nodes
  var maxLines = 1;
  MODS.forEach(function(m){ if(m.lines > maxLines) maxLines = m.lines; });
  MODS.forEach(function(m) {
    var g = GROUP_MAP[m.group];
    cy.add({
      group: 'nodes',
      data: {
        id: m.id,
        label: m.file,
        color: g ? g.color : '#58a6ff',
        _type: 'module',
        file: m.file,
        path: m.path,
        desc: m.desc,
        group: m.group,
        lines: m.lines
      },
      classes: 'mod'
    });
  });
  // Size nodes
  cy.nodes().style({
    'width': function(n){ return 20 + ((n.data('lines')||1)/maxLines)*60; },
    'height': function(n){ return 16 + ((n.data('lines')||1)/maxLines)*25; }
  });
  
  // Add all edges
  EDGES.forEach(function(e) {
    if (cy.getElementById(e.source).length && cy.getElementById(e.target).length) {
      cy.add({ group: 'edges', data: { source: e.source, target: e.target } });
    }
  });
  
  // Run layout
  if (name === 'hubs') {
    cy.layout({ name: 'concentric', concentric: function(n){ return n.connectedEdges().length; }, levelWidth: function(){ return 2; }, minNodeSpacing: 30, fit: true, padding: 60, animate: true, animationDuration: 400 }).run();
  } else if (name === 'tiers') {
    cy.layout({ name: 'breadthfirst', directed: true, spacingFactor: 1.3, fit: true, padding: 60, animate: true, animationDuration: 400 }).run();
  } else if (name === 'circle') {
    cy.layout({ name: 'circle', spacingFactor: 1.2, fit: true, padding: 60, animate: true, animationDuration: 400 }).run();
  } else if (name === 'modules') {
    cy.layout({ name: 'cose', nodeRepulsion: 8000, gravity: 0.3, numIter: 1000, idealEdgeLength: 100, fit: true, padding: 60, animate: true, animationDuration: 400 }).run();
  }
  updateStatus();
}

// Tab handlers
var tabs = document.querySelectorAll('#topbar .tab[data-layout]');
for (var i = 0; i < tabs.length; i++) {
  (function(tab){
    tab.onclick = function() {
      runLayout(this.getAttribute('data-layout'));
    };
  })(tabs[i]);
}

// Init
init();
</script>
</body>
