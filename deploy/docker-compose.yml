services:
  ww:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ww-local
    image: ww-local:latest
    restart: unless-stopped
    user: "${WW_UID:-1000}:${WW_GID:-1000}"
    ports:
      - "127.0.0.1:${WW_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${WW_WORKSPACE_MOUNT:-../.}:/workspace"
      - "${WW_COOKIE_FILE_MOUNT:-../cookies.txt}:/run/secrets/cookies.txt:ro"
    env_file:
      - ../.env
    environment:
      WW_WORKSPACE: /workspace
      WW_COOKIE_FILE: /run/secrets/cookies.txt
      WW_AUDIT_LOG: /workspace/.ww/audit.jsonl
      WW_CORS_ORIGINS: "${WW_CORS_ORIGINS:-https://gemquota.github.io}"
      WW_DASHBOARD_API_KEY: "${WW_DASHBOARD_API_KEY:?Set WW_DASHBOARD_API_KEY in the environment or .env}"
      PYTHONUNBUFFERED: "1"

# The image defaults to the local browser API. To run the terminal instead:
# docker compose -f deploy/docker-compose.yml run --rm --entrypoint python ww gemini_bridge.py
