name: WW Bridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff

    - name: Type check with mypy
      run: python -m mypy src/ --config-file mypy.ini || true

    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Syntax check
      run: |
        python -m py_compile gemini_bridge.py
        python -m py_compile src/gemini_bridge.py
        python -m py_compile src/config.py
        python -m py_compile src/core/schemas.py
        python -m py_compile src/core/memory.py
        python -m py_compile src/core/healing.py
        python -m py_compile src/core/benchmarker.py
        python -m py_compile src/core/judge.py
        python -m py_compile src/tools/registry.py
        python -m py_compile src/tools/system_tools.py
        python -m py_compile src/utils/validation.py
        python -m py_compile src/utils/web_client.py
        python -m py_compile src/context_manager.py
        python -m py_compile src/smart_context.py
        python -m py_compile src/permissions.py
        python -m py_compile src/diff_engine.py
        python -m py_compile src/checkpoint.py
        python -m py_compile src/agents_loader.py
        python -m py_compile src/telemetry.py
        python -m py_compile src/dashboard/app.py
        python -m py_compile src/plugins/ww_plugin.py

    - name: Run unit tests
      run: python -m pytest .tests/ -v --tb=short

    - name: Run golden benchmark suite (if API keys set)
      if: env.SECURE_1PSID != '' && env.SECURE_1PSIDTS != ''
      run: python -m pytest .tests/benchmarks/ -v --tb=short || true
      env:
        SECURE_1PSID: ${{ secrets.SECURE_1PSID }}
        SECURE_1PSIDTS: ${{ secrets.SECURE_1PSIDTS }}
